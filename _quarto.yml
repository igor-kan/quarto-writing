project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"

execute:
  freeze: auto

author: "Igor Kan"

website:
  title: "My Writings"
  site-url: "https://igor-kan.github.io/quarto-writing"
  repo-url: "https://github.com/igor-kan/quarto-writing"
  description: "A personal collection of academic notes, technical essays, and tutorials."
  page-footer: "© 2026 Igor Kan"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: posts/index.qmd
        text: Blog

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    math: true
    code-fold: show
    code-tools: true
    code-copy: true
    date-format: "YYYY-MM-DD"
    fig-align: center
    fig-responsive: true
